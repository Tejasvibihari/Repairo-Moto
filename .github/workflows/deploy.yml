
name: Repairo Moto CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: client
        continue-on-error: true
        run: pnpm run lint

      - name: Build frontend
        working-directory: client
        run: pnpm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          

      - name: Install backend dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        working-directory: server
        run: |
          find . \
            -path './node_modules' -prune -o \
            -path './uploads' -prune -o \
            -path './private_uploads' -prune -o \
            -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check
